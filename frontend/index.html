<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./imgs/logo_no_bg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileNotFound — Zero-Trust Temporary File Transfer</title>
    <meta
      name="description"
      content="Your files. Your rules. Share files securely with links that expire automatically and access limits you control."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Clear stale service workers from any previous projects on this origin
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (const registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </head>
  <body class="bg-white text-[#111111] antialiased min-h-screen select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
